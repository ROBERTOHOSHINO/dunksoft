<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUNGLIA｜アクセス＆ガイド（提案デモ）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0C241D;
    --canopy:#143A2E;
    --canopy-2:#1C4A3A;
    --leaf:#4FB477;
    --lime:#CDEB5B;
    --sand:#ECE4D0;
    --cream:#EFF3EA;
    --muted:#9DB3A6;
    --line:rgba(207,229,200,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"Noto Sans JP","Noto Sans TC","Noto Sans KR",sans-serif;
    background:
      radial-gradient(120% 80% at 80% -10%, rgba(79,180,119,.18), transparent 55%),
      radial-gradient(90% 70% at -10% 10%, rgba(205,235,91,.08), transparent 50%),
      var(--ink);
    color:var(--cream);
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  ruby rt{font-size:.55em;color:var(--lime);font-weight:500;letter-spacing:0}
  body.no-furi rt{display:none}
  .wrap{max-width:880px;margin:0 auto;padding:0 22px}

  /* top bar */
  .topbar{
    position:sticky;top:0;z-index:50;
    backdrop-filter:blur(12px);
    background:linear-gradient(var(--ink),rgba(12,36,29,.78));
    border-bottom:1px solid var(--line);
  }
  .topbar .wrap{display:flex;align-items:center;gap:14px;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
  .badge{
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-size:11px;font-weight:700;letter-spacing:.14em;
    color:var(--ink);background:var(--lime);
    padding:5px 10px;border-radius:999px;white-space:nowrap;
  }
  .controls{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .langset{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .langset button{
    font-family:inherit;font-size:13px;font-weight:700;
    background:transparent;color:var(--muted);border:0;cursor:pointer;
    padding:7px 13px;transition:background .2s,color .2s;
  }
  .langset button:hover{color:var(--cream)}
  .langset button[aria-pressed="true"]{background:var(--leaf);color:var(--ink)}
  .furi-btn{
    font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.04em;
    background:transparent;color:var(--lime);
    border:1px solid var(--lime);border-radius:999px;
    padding:7px 12px;cursor:pointer;transition:background .2s,color .2s;white-space:nowrap;
  }
  .furi-btn[aria-pressed="false"]{color:var(--muted);border-color:var(--line)}
  .furi-btn.hidden{display:none}
  button:focus-visible,a:focus-visible{outline:2px solid var(--lime);outline-offset:3px}

  /* hero */
  .hero{padding:64px 0 40px;position:relative}
  .eyebrow{
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--leaf);
    margin-bottom:18px;display:inline-block;
  }
  .hero h1{
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-weight:900;line-height:1.15;
    font-size:clamp(34px,7vw,58px);
    letter-spacing:-.01em;margin-bottom:18px;
  }
  .hero h1 .glow{color:var(--lime)}
  .hero p.sub{font-size:clamp(15px,2.4vw,18px);color:var(--sand);max-width:46ch}

  /* section heading */
  .sec{padding:38px 0}
  .sec-label{
    font-family:"Zen Kaku Gothic New",sans-serif;
    display:flex;align-items:center;gap:12px;
    font-size:14px;font-weight:700;letter-spacing:.12em;color:var(--muted);
    text-transform:uppercase;margin-bottom:28px;
  }
  .sec-label::after{content:"";flex:1;height:1px;background:var(--line)}

  /* TRAIL — signature element */
  .trail{position:relative;padding-left:8px}
  .trail::before{
    content:"";position:absolute;left:23px;top:14px;bottom:34px;
    width:2px;border-left:2px dashed var(--leaf);opacity:.5;
  }
  .stop{position:relative;display:grid;grid-template-columns:48px 1fr;gap:20px;
    padding:0 0 30px;opacity:0;transform:translateY(14px);
    animation:rise .6s ease forwards;
  }
  .stop:nth-child(2){animation-delay:.05s}
  .stop:nth-child(3){animation-delay:.18s}
  .stop:nth-child(4){animation-delay:.31s}
  .marker{
    width:48px;height:48px;border-radius:50%;
    background:var(--canopy);border:2px solid var(--leaf);
    display:flex;align-items:center;justify-content:center;
    font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;font-size:18px;color:var(--lime);
    position:relative;z-index:2;flex-shrink:0;
  }
  .stop:last-of-type .marker{background:var(--lime);color:var(--ink);border-color:var(--lime)}
  .stop-body{padding-top:4px}
  .stop-body h3{
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-size:19px;font-weight:700;margin-bottom:6px;
  }
  .stop-body .tag{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--leaf);display:block;margin-bottom:4px}
  .stop-body p{font-size:15px;color:var(--sand)}

  .note{
    margin-top:6px;background:var(--canopy);border:1px solid var(--line);
    border-radius:16px;padding:20px 22px;
  }
  .note h4{font-family:"Zen Kaku Gothic New",sans-serif;font-size:14px;color:var(--lime);margin-bottom:8px;font-weight:700}
  .note p{font-size:14px;color:var(--sand)}

  /* attraction card */
  .card{
    background:linear-gradient(160deg,var(--canopy-2),var(--canopy));
    border:1px solid var(--line);border-radius:22px;overflow:hidden;
  }
  .card-top{
    padding:30px 28px 24px;
    background:
      radial-gradient(120% 100% at 100% 0%, rgba(205,235,91,.12), transparent 60%);
  }
  .card .tag{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--lime);display:block;margin-bottom:10px}
  .card h3{font-family:"Zen Kaku Gothic New",sans-serif;font-size:clamp(22px,4vw,28px);font-weight:900;margin-bottom:14px}
  .card p.lead{font-size:15px;color:var(--sand)}
  .meta{display:flex;flex-wrap:wrap;gap:10px;padding:18px 28px 26px;border-top:1px solid var(--line)}
  .chip{
    font-size:12px;font-weight:500;color:var(--cream);
    background:rgba(207,229,200,.08);border:1px solid var(--line);
    padding:6px 12px;border-radius:999px;
  }
  .chip b{color:var(--lime);font-weight:700}

  footer{padding:48px 0 60px;border-top:1px solid var(--line);margin-top:30px}
  footer .wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:space-between}
  footer .credit{font-family:"Zen Kaku Gothic New",sans-serif;font-size:13px;color:var(--muted)}
  footer .credit b{color:var(--cream);font-weight:700}
  footer .scope{font-size:12px;color:var(--muted);max-width:44ch}

  @keyframes rise{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .stop{animation:none;opacity:1;transform:none}
    html{scroll-behavior:auto}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <span class="badge" data-i18n="badge">提案デモ・非公式</span>
    <div class="controls">
      <button class="furi-btn" id="furiBtn" aria-pressed="true">ふりがな ON</button>
      <div class="langset" role="group" aria-label="Language">
        <button data-lang="jp" aria-pressed="true">日本語</button>
        <button data-lang="en" aria-pressed="false">EN</button>
        <button data-lang="tc" aria-pressed="false">繁中</button>
        <button data-lang="ko" aria-pressed="false">한국어</button>
      </div>
    </div>
  </div>
</div>

<header class="hero">
  <div class="wrap">
    <span class="eyebrow" data-i18n="eyebrow"></span>
    <h1 data-i18n="title"></h1>
    <p class="sub" data-i18n="sub"></p>
  </div>
</header>

<section class="sec">
  <div class="wrap">
    <div class="sec-label" data-i18n="access_label"></div>

    <div class="trail">
      <div class="stop">
        <div class="marker">01</div>
        <div class="stop-body">
          <span class="tag" data-i18n="s1tag"></span>
          <h3 data-i18n="s1title"></h3>
          <p data-i18n="s1body"></p>
        </div>
      </div>
      <div class="stop">
        <div class="marker">02</div>
        <div class="stop-body">
          <span class="tag" data-i18n="s2tag"></span>
          <h3 data-i18n="s2title"></h3>
          <p data-i18n="s2body"></p>
        </div>
      </div>
      <div class="stop">
        <div class="marker">03</div>
        <div class="stop-body">
          <span class="tag" data-i18n="s3tag"></span>
          <h3 data-i18n="s3title"></h3>
          <p data-i18n="s3body"></p>
        </div>
      </div>
    </div>

    <div class="note">
      <h4 data-i18n="why_title"></h4>
      <p data-i18n="why_body"></p>
    </div>
  </div>
</section>

<section class="sec">
  <div class="wrap">
    <div class="sec-label" data-i18n="attr_label"></div>
    <div class="card">
      <div class="card-top">
        <span class="tag" data-i18n="attr_tag"></span>
        <h3 data-i18n="attr_title"></h3>
        <p class="lead" data-i18n="attr_body"></p>
      </div>
      <div class="meta">
        <span class="chip" data-i18n="chip1"></span>
        <span class="chip" data-i18n="chip2"></span>
        <span class="chip" data-i18n="chip3"></span>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <span class="credit" data-i18n="credit"></span>
    <span class="scope" data-i18n="scope"></span>
  </div>
</footer>

const LANG_ATTR = {jp:"ja",en:"en",tc:"zh-Hant",ko:"ko"};
let current = "jp";

function render(lang){
  current = lang;
  document.documentElement.lang = LANG_ATTR[lang];
  const d = DICT[lang];
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k = el.getAttribute("data-i18n");
    if(d[k] !== undefined) el.innerHTML = d[k];
  });
  document.querySelectorAll(".langset button").forEach(b=>{
    b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true":"false");
  });
  const furiBtn = document.getElementById("furiBtn");
  furiBtn.classList.toggle("hidden", lang !== "jp");
}

document.querySelectorAll(".langset button").forEach(b=>{
  b.addEventListener("click", ()=> render(b.dataset.lang));
});

const furiBtn = document.getElementById("furiBtn");
furiBtn.addEventListener("click", ()=>{
  const on = furiBtn.getAttribute("aria-pressed") === "true";
  furiBtn.setAttribute("aria-pressed", String(!on));
  furiBtn.textContent = on ? "ふりがな OFF" : "ふりがな ON";
  document.body.classList.toggle("no-furi", on);
});

render("jp");
</script>
</body>
</html>
